<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Viewer — Kulan Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL = 'https://xkadqvmqxdyqoddiypet.supabase.co';
var SUPABASE_KEY = 'sb_publishable_VVERiS7NeHDtlXJqJX8Jtg_K2UNsctv';
var _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<style>
:root {
  --navy:#0B1F3A; --blue:#1A3C6E; --cyan:#1BAECC;
  --gold:#D4A843; --teal:#0E7C7B; --white:#FFFFFF;
  --text:#1a2840; --text-mid:#4a6080; --text-light:#8a9bb0;
  --bg:#F8F6F1;
}
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; overflow:hidden; font-family:'DM Sans',sans-serif; background:var(--navy); }

/* Loading */
#loadingScreen {
  position:fixed; inset:0; background:var(--navy);
  display:flex; align-items:center; justify-content:center; z-index:9999;
  flex-direction:column; gap:14px;
}
.spinner {
  width:36px; height:36px; border-radius:50%;
  border:3px solid rgba(255,255,255,0.1); border-top-color:var(--cyan);
  animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
#loadingScreen p { color:rgba(255,255,255,0.5); font-size:14px; }

/* Page layout */
#page { display:none; height:100vh; flex-direction:column; }
#page.visible { display:flex; }

/* Topbar */
.topbar {
  height:58px; flex-shrink:0;
  background:var(--navy); border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; justify-content:space-between; padding:0 20px;
}
.topbar-left { display:flex; align-items:center; gap:14px; }
.back-btn {
  color:rgba(255,255,255,0.5); text-decoration:none; font-size:13px;
  font-weight:500; transition:color .2s; display:flex; align-items:center; gap:6px;
}
.back-btn:hover { color:var(--cyan); }
.course-badge {
  background:rgba(27,174,204,0.12); border:1px solid rgba(27,174,204,0.2);
  border-radius:20px; padding:5px 14px; font-size:12px; font-weight:600; color:var(--cyan);
}
.topbar-right { display:flex; align-items:center; gap:12px; }
#progressLabel { font-size:12px; color:rgba(255,255,255,0.4); }
.download-btn {
  padding:7px 14px; border-radius:8px; font-size:12px; font-weight:600;
  background:rgba(212,168,67,0.12); border:1px solid rgba(212,168,67,0.25);
  color:var(--gold); text-decoration:none; transition:all .2s;
}
.download-btn:hover { background:rgba(212,168,67,0.2); }
.download-btn.hidden { display:none; }

/* Progress bar */
.progress-bar-wrap { height:3px; background:rgba(255,255,255,0.06); flex-shrink:0; }
.progress-bar { height:100%; background:linear-gradient(90deg,var(--cyan),var(--teal)); transition:width .4s; }

/* Main layout */
.layout { flex:1; display:flex; overflow:hidden; }

/* Sidebar */
.sidebar {
  width:300px; flex-shrink:0;
  background:rgba(255,255,255,0.03); border-right:1px solid rgba(255,255,255,0.08);
  display:flex; flex-direction:column; overflow:hidden;
}
.sidebar-header { padding:20px; border-bottom:1px solid rgba(255,255,255,0.06); }
.sidebar-title { font-family:'Playfair Display',serif; font-size:16px; font-weight:700; color:#fff; margin-bottom:4px; }
.sidebar-sub { font-size:12px; color:rgba(255,255,255,0.35); }
.module-list { flex:1; overflow-y:auto; padding:12px; }
.module-list::-webkit-scrollbar { width:4px; }
.module-list::-webkit-scrollbar-track { background:transparent; }
.module-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:4px; }

.mod-item {
  padding:13px 14px; border-radius:12px; cursor:pointer;
  margin-bottom:6px; transition:all .2s;
  border:1.5px solid transparent;
  display:flex; align-items:center; gap:12px;
}
.mod-item:hover { background:rgba(255,255,255,0.06); }
.mod-item.active { background:rgba(27,174,204,0.1); border-color:rgba(27,174,204,0.25); }
.mod-item.done { background:rgba(34,197,94,0.06); border-color:rgba(34,197,94,0.15); }
.mod-icon { font-size:18px; flex-shrink:0; width:24px; text-align:center; }
.mod-info { flex:1; min-width:0; }
.mod-name { font-size:13px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mod-meta { font-size:11px; color:rgba(255,255,255,0.35); margin-top:2px; text-transform:uppercase; letter-spacing:.4px; }

/* Viewer */
.viewer { flex:1; display:flex; flex-direction:column; overflow:hidden; background:#0d1929; }
.viewer-header {
  padding:14px 20px; border-bottom:1px solid rgba(255,255,255,0.06);
  display:none;
}
.viewer-title { font-size:15px; font-weight:700; color:#fff; }
.viewer-meta { font-size:12px; color:rgba(255,255,255,0.4); margin-top:3px; }
.viewer-frame { flex:1; position:relative; overflow:hidden; }

.no-content {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px; text-align:center; padding:40px;
}
.no-content .icon { font-size:52px; }
.no-content h3 { font-family:'Playfair Display',serif; font-size:20px; color:rgba(255,255,255,0.7); }
.no-content p { font-size:14px; color:rgba(255,255,255,0.35); line-height:1.7; }

#contentFrame { width:100%; height:100%; border:none; display:none; }

@media(max-width:768px) {
  .layout { flex-direction:column; }
  .sidebar { width:100%; height:220px; border-right:none; border-bottom:1px solid rgba(255,255,255,0.08); }
  .module-list { display:flex; gap:8px; padding:10px; overflow-x:auto; overflow-y:hidden; }
  .mod-item { flex-shrink:0; width:200px; }
}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <p>Loading course...</p>
</div>

<div id="page">
  <div class="topbar">
    <div class="topbar-left">
      <a href="/dashboard.html" class="back-btn">&#8592; Dashboard</a>
      <div class="course-badge" id="courseBadge">Loading...</div>
    </div>
    <div class="topbar-right">
      <div id="progressLabel"></div>
      <a href="#" class="download-btn hidden" id="downloadBtn" target="_blank">&#11015; Download</a>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title" id="sidebarTitle">Course Materials</div>
        <div class="sidebar-sub" id="sidebarSub">Select a module to begin</div>
      </div>
      <div class="module-list" id="moduleList">
        <div style="text-align:center;padding:32px 16px;color:rgba(255,255,255,0.3);">
          <div style="font-size:28px;margin-bottom:8px;">&#128109;</div>
          <div style="font-size:13px;">No materials added yet.</div>
        </div>
      </div>
    </div>

    <div class="viewer">
      <div class="viewer-header" id="viewerHeader">
        <div class="viewer-title" id="viewerTitle"></div>
        <div class="viewer-meta" id="viewerMeta"></div>
      </div>
      <div class="viewer-frame">
        <div class="no-content" id="noContent">
          <div class="icon">&#127891;</div>
          <h3>Select a module to start learning</h3>
          <p>Choose a lesson from the sidebar<br>to view your course materials.</p>
        </div>
        <iframe id="contentFrame" allow="fullscreen"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
var _viewerUser  = null;
var _courseId    = null;
var _completed   = [];
var _allMats     = [];
var _enrollment  = null;

// ── AUTH ──────────────────────────────────────────────────────────
var _started = false;
function tryStart(user) {
  if (_started) return;
  if (!user) return;
  _started = true;
  _viewerUser = user;
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('page').classList.add('visible');
  loadCourse();
}

_sb.auth.getSession().then(function(r) {
  tryStart(r.data.session ? r.data.session.user : null);
  if (!r.data.session) {
    setTimeout(function() {
      _sb.auth.getSession().then(function(r2) { tryStart(r2.data.session ? r2.data.session.user : null); });
    }, 1500);
    setTimeout(function() { if (!_started) window.location.href = '/login.html'; }, 9000);
  }
});
_sb.auth.onAuthStateChange(function(event, session) {
  if (event === 'SIGNED_IN')  tryStart(session ? session.user : null);
  if (event === 'SIGNED_OUT') window.location.href = '/login.html';
});

// ── LOAD COURSE ───────────────────────────────────────────────────
function loadCourse() {
  var params = new URLSearchParams(window.location.search);
  _courseId  = params.get('course') || null;

  Promise.all([
    _sb.from('courses').select('*'),
    _sb.from('materials').select('*').order('module_number')
  ]).then(function(results) {
    var courses   = results[0].data || [];
    var materials = results[1].data || [];
    _allMats = materials;

    var course = courses.find(function(c) { return String(c.id) === String(_courseId); })
              || courses[0];
    if (!course) {
      document.getElementById('moduleList').innerHTML =
        '<div style="padding:20px;color:rgba(255,255,255,0.4);font-size:13px;">Course not found.</div>';
      return;
    }
    _courseId = course.id;

    document.getElementById('courseBadge').innerHTML = '<span>' + esc(course.title) + '</span>';
    document.getElementById('sidebarTitle').textContent = course.title;

    var courseMats = materials
      .filter(function(m) { return m.course_id === course.id; })
      .sort(function(a, b) { return (a.module_number || 0) - (b.module_number || 0); });

    document.getElementById('sidebarSub').textContent =
      courseMats.length + ' module' + (courseMats.length !== 1 ? 's' : '');

    // Load enrollment / progress
    _sb.from('enrollments')
      .select('*')
      .eq('user_id', _viewerUser.id)
      .eq('course_id', course.id)
      .maybeSingle()
      .then(function(enResult) {
        _enrollment  = enResult.data;
        _completed   = (_enrollment && _enrollment.completed_materials) ? _enrollment.completed_materials : [];
        renderModuleList(courseMats);
        updateProgressBar(courseMats.length);
      });
  });
}

// ── RENDER MODULE LIST ────────────────────────────────────────────
function renderModuleList(mats) {
  var list = document.getElementById('moduleList');
  if (mats.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:32px;color:rgba(255,255,255,0.3);"><div style="font-size:28px;margin-bottom:8px;">&#128109;</div><div style="font-size:13px;">No materials yet.<br>Check back soon!</div></div>';
    return;
  }
  list.innerHTML = '';
  var icons  = { pdf:'&#128196;', video:'&#127909;', ppt:'&#128202;', other:'&#128190;' };
  mats.forEach(function(mat) {
    var done  = _completed.indexOf(mat.id) > -1;
    var icon  = icons[mat.type] || icons.other;
    var el    = document.createElement('div');
    el.className = 'mod-item' + (done ? ' done' : '');
    el.id = 'mod-' + mat.id;
    el.innerHTML =
      '<div class="mod-icon">' + (done ? '&#9989;' : icon) + '</div>'
      + '<div class="mod-info">'
      + '<div class="mod-name">M' + mat.module_number + ': ' + esc(mat.title) + '</div>'
      + '<div class="mod-meta">' + (mat.type || 'file').toUpperCase() + '</div>'
      + '</div>';
    el.addEventListener('click', function() { openMaterial(mat, mats.length); });
    list.appendChild(el);
  });
}

// ── OPEN MATERIAL ─────────────────────────────────────────────────
function openMaterial(mat, totalMats) {
  // Update active state
  document.querySelectorAll('.mod-item').forEach(function(el) { el.classList.remove('active'); });
  var modEl = document.getElementById('mod-' + mat.id);
  if (modEl) modEl.classList.add('active');

  // Show viewer header
  document.getElementById('viewerHeader').style.display = 'block';
  document.getElementById('viewerTitle').textContent = mat.title;
  document.getElementById('viewerMeta').textContent = 'Module ' + mat.module_number + ' · ' + (mat.type || 'file').toUpperCase();

  // Resolve URL
  var url = mat.url || '';
  if (url.startsWith('ki_file_')) {
    var stored = localStorage.getItem(url);
    if (stored) url = stored;
    else { alert('File not found in this browser. It may have been uploaded on another device.'); return; }
  }

  // Show content
  document.getElementById('noContent').style.display = 'none';
  var frame = document.getElementById('contentFrame');
  frame.style.display = 'block';
  frame.src = url;

  // Download button
  var dlBtn = document.getElementById('downloadBtn');
  if (mat.allow_download && url) {
    dlBtn.href = url;
    dlBtn.classList.remove('hidden');
  } else {
    dlBtn.classList.add('hidden');
  }

  // Mark complete
  if (_completed.indexOf(mat.id) === -1) {
    _completed.push(mat.id);
    updateProgressBar(totalMats);
    updateModuleState(mat.id);
    saveProgress();
  }
}

// ── PROGRESS ──────────────────────────────────────────────────────
function updateProgressBar(total) {
  var pct = total > 0 ? Math.round((_completed.length / total) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = _completed.length + '/' + total + ' completed';
}

function updateModuleState(matId) {
  var el = document.getElementById('mod-' + matId);
  if (!el) return;
  el.classList.add('done');
  var icon = el.querySelector('.mod-icon');
  if (icon) icon.innerHTML = '&#9989;';
}

function saveProgress() {
  if (!_viewerUser || !_courseId) return;
  _sb.from('enrollments').upsert({
    user_id:              _viewerUser.id,
    course_id:            _courseId,
    completed_materials:  _completed,
    progress:             _completed.length
  }, { onConflict: 'user_id,course_id' }).then(function() {});
}

// ── HELPERS ───────────────────────────────────────────────────────
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>

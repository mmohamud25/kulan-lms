<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Kulan Institute</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL = 'https://xkadqvmqxdyqoddiypet.supabase.co';
var SUPABASE_KEY = 'sb_publishable_VVERiS7NeHDtlXJqJX8Jtg_K2UNsctv';
var _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
<style>
:root { --navy:#0B1F3A; --blue:#1A3C6E; --cyan:#1BAECC; --gold:#D4A843; --teal:#0E7C7B; --white:#FFFFFF; }
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'DM Sans',sans-serif;
  background:linear-gradient(160deg,var(--navy) 0%,var(--blue) 60%,#0E3A5A 100%);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
}
.grid-bg {
  position:absolute; inset:0;
  background-image:linear-gradient(rgba(27,174,204,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(27,174,204,0.06) 1px,transparent 1px);
  background-size:60px 60px;
}
.glow {
  position:absolute; width:500px; height:500px;
  background:radial-gradient(circle,rgba(27,174,204,0.15) 0%,transparent 70%);
  right:-100px; top:-100px; border-radius:50%;
}
.card {
  position:relative; z-index:1;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:24px; padding:52px 48px;
  width:100%; max-width:440px;
  backdrop-filter:blur(12px); text-align:center;
}
.logo { display:inline-flex; align-items:center; gap:12px; text-decoration:none; margin-bottom:32px; }
.logo-icon {
  width:48px; height:48px;
  background:linear-gradient(135deg,var(--gold),#e8c060);
  border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-family:'Playfair Display',serif; font-weight:900; font-size:22px; color:var(--navy);
}
.logo-text .t1 { font-size:14px; font-weight:600; color:var(--white); text-align:left; }
.logo-text .t2 { font-size:11px; color:rgba(212,168,67,0.7); text-align:left; }
.badge {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(27,174,204,0.12); border:1px solid rgba(27,174,204,0.25);
  border-radius:20px; padding:5px 14px; font-size:12px; font-weight:600;
  color:var(--cyan); margin-bottom:20px;
}
h1 { font-family:'Playfair Display',serif; font-size:28px; font-weight:700; color:var(--white); margin-bottom:8px; }
.subtitle { font-size:14px; color:rgba(255,255,255,0.5); margin-bottom:28px; line-height:1.6; }
.f-input {
  width:100%; padding:13px 16px; border-radius:10px;
  border:1.5px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.07); color:#fff;
  font-family:'DM Sans',sans-serif; font-size:14px;
  outline:none; transition:border .2s; margin-bottom:12px;
}
.f-input:focus { border-color:var(--cyan); background:rgba(255,255,255,0.1); }
.f-input::placeholder { color:rgba(255,255,255,0.3); }
.strength-bar {
  height:4px; border-radius:4px; margin-bottom:12px;
  background:rgba(255,255,255,0.08); overflow:hidden;
}
.strength-fill { height:100%; border-radius:4px; width:0%; transition:width .3s, background .3s; }
.strength-text { font-size:11px; color:rgba(255,255,255,0.35); text-align:left; margin-bottom:14px; margin-top:-8px; }
.submit-btn {
  width:100%;
  background:linear-gradient(135deg,var(--cyan),var(--teal));
  color:var(--white); border:none; border-radius:12px;
  padding:16px; font-size:16px; font-weight:700;
  cursor:pointer; font-family:'DM Sans',sans-serif;
  transition:transform 0.2s, box-shadow 0.2s; margin-bottom:16px; margin-top:4px;
}
.submit-btn:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(27,174,204,0.35); }
.submit-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
.status-msg {
  font-size:13px; padding:10px 14px; border-radius:8px; margin-bottom:12px;
  display:none; font-weight:500;
}
.status-msg.error   { display:block; background:rgba(239,68,68,0.12); color:#fca5a5; border:1px solid rgba(239,68,68,0.2); }
.status-msg.success { display:block; background:rgba(34,197,94,0.12); color:#86efac; border:1px solid rgba(34,197,94,0.2); }
.status-msg.info    { display:block; background:rgba(27,174,204,0.12); color:var(--cyan); border:1px solid rgba(27,174,204,0.2); }
.back-link { display:inline-block; margin-top:8px; font-size:13px; color:rgba(255,255,255,0.3); text-decoration:none; transition:color .2s; }
.back-link:hover { color:rgba(255,255,255,0.6); }
/* Loading state */
#loadingState { text-align:center; padding:20px 0; }
#loadingState .spinner {
  width:36px; height:36px; border-radius:50%;
  border:3px solid rgba(255,255,255,0.1);
  border-top-color:var(--cyan);
  animation:spin .8s linear infinite; margin:0 auto 14px;
}
@keyframes spin { to { transform:rotate(360deg); } }
#loadingState p { font-size:14px; color:rgba(255,255,255,0.5); }
#resetForm { display:none; }
#successState { display:none; text-align:center; }
#successState .success-icon { font-size:52px; margin-bottom:16px; }
#successState h2 { font-family:'Playfair Display',serif; font-size:22px; color:#fff; margin-bottom:10px; }
#successState p { font-size:14px; color:rgba(255,255,255,0.5); margin-bottom:24px; }
@media(max-width:480px) { .card { padding:36px 24px; margin:16px; } h1 { font-size:24px; } }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow"></div>

<div class="card">
  <a href="/login.html" class="logo">
    <div class="logo-icon">KI</div>
    <div class="logo-text">
      <div class="t1">Kulan Institute</div>
      <div class="t2">of Learning</div>
    </div>
  </a>

  <!-- Loading state while we verify the token -->
  <div id="loadingState">
    <div class="spinner"></div>
    <p>Verifying your reset link...</p>
  </div>

  <!-- Reset form — shown after token verified -->
  <div id="resetForm">
    <div class="badge">&#128273; Password Reset</div>
    <h1>New Password</h1>
    <p class="subtitle">Choose a strong password for your account.</p>

    <div id="statusMsg" class="status-msg"></div>

    <input type="password" id="passInput" class="f-input" placeholder="New password" oninput="checkStrength(this.value)">
    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    <div class="strength-text" id="strengthText"></div>

    <input type="password" id="confirmInput" class="f-input" placeholder="Confirm new password">

    <button class="submit-btn" id="submitBtn" onclick="doReset()">&#128273; Update Password</button>
    <a href="/login.html" class="back-link">&larr; Back to login</a>
  </div>

  <!-- Success state -->
  <div id="successState">
    <div class="success-icon">&#10003;</div>
    <h2>Password Updated!</h2>
    <p>Your password has been changed successfully. You can now sign in with your new password.</p>
    <a href="/login.html" class="submit-btn" style="display:block;text-decoration:none;padding:16px;">Go to Login &rarr;</a>
  </div>
</div>

<script>
function showStatus(msg, type) {
  var el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
}

function checkStrength(pass) {
  var fill = document.getElementById('strengthFill');
  var text = document.getElementById('strengthText');
  if (!pass) { fill.style.width='0%'; text.textContent=''; return; }
  var score = 0;
  if (pass.length >= 8)  score++;
  if (pass.length >= 12) score++;
  if (/[A-Z]/.test(pass)) score++;
  if (/[0-9]/.test(pass)) score++;
  if (/[^A-Za-z0-9]/.test(pass)) score++;
  var levels = [
    { w:'20%', c:'#ef4444', t:'Very weak' },
    { w:'40%', c:'#f97316', t:'Weak' },
    { w:'60%', c:'#eab308', t:'Fair' },
    { w:'80%', c:'#22c55e', t:'Strong' },
    { w:'100%',c:'#16a34a', t:'Very strong' }
  ];
  var lvl = levels[Math.min(score, 4)];
  fill.style.width = lvl.w;
  fill.style.background = lvl.c;
  text.textContent = lvl.t;
}

function doReset() {
  var pass    = document.getElementById('passInput').value;
  var confirm = document.getElementById('confirmInput').value;
  if (!pass || pass.length < 8) { showStatus('Password must be at least 8 characters.', 'error'); return; }
  if (pass !== confirm) { showStatus('Passwords do not match.', 'error'); return; }
  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Updating...';
  _sb.auth.updateUser({ password: pass }).then(function(result) {
    if (result.error) {
      showStatus(result.error.message || 'Could not update password. Try requesting a new reset link.', 'error');
      btn.disabled = false; btn.textContent = '\uD83D\uDD73 Update Password';
    } else {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
      // Sign out so they log in fresh with new password
      setTimeout(function() { _sb.auth.signOut(); }, 500);
    }
  });
}

// On page load — check for the auth token in the URL
// Supabase appends #access_token=... to the URL when the reset link is clicked
_sb.auth.onAuthStateChange(function(event, session) {
  if (event === 'PASSWORD_RECOVERY') {
    // Token is valid — show the reset form
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('resetForm').style.display = 'block';
  }
});

// Also handle the case where page loads with token already in hash
_sb.auth.getSession().then(function(result) {
  if (result.data.session) {
    // Check if this is a recovery session
    var hash = window.location.hash;
    if (hash.indexOf('type=recovery') > -1 || hash.indexOf('access_token') > -1) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('resetForm').style.display = 'block';
    } else {
      // Already logged in normally — redirect to dashboard
      window.location.href = '/dashboard.html';
    }
  } else {
    // Wait for PASSWORD_RECOVERY event
    setTimeout(function() {
      var loading = document.getElementById('loadingState');
      var form    = document.getElementById('resetForm');
      if (loading.style.display !== 'none' && form.style.display === 'none') {
        // Token expired or invalid
        loading.innerHTML = '<div style="font-size:36px;margin-bottom:14px;">&#128683;</div><p style="color:#fca5a5;margin-bottom:16px;">This reset link has expired or is invalid.</p><a href="/login.html" style="color:var(--cyan);font-size:14px;">Request a new one &rarr;</a>';
      }
    }, 4000);
  }
});
</script>
</body>
</html>

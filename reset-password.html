<style>
:root{ --navy:#0B2545; --blue:#1A3A6B; --cyan:#0D9488; --gold:#D97706; --gold2:#F59E0B; --teal:#0D9488; }
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'DM Sans',sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#060f1e,var(--navy),#0d2a50);
  position:relative; overflow:hidden; padding:20px;
}
.bg-grid { position:absolute;inset:0;background-image:linear-gradient(rgba(27,174,204,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(27,174,204,0.05) 1px,transparent 1px);background-size:56px 56px;pointer-events:none; }
.bg-orb  { position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(27,174,204,0.1),transparent 70%);right:-100px;bottom:-100px;pointer-events:none; }

.card { position:relative;z-index:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:22px;padding:44px 40px;width:100%;max-width:420px;backdrop-filter:blur(14px);box-shadow:0 24px 64px rgba(0,0,0,0.3); }

.logo { display:flex;align-items:center;gap:12px;text-decoration:none;margin-bottom:28px;justify-content:center; }
.logo-icon { width:44px;height:44px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;font-size:20px;color:var(--navy); }
.logo-text .t1 { font-size:14px;font-weight:700;color:#fff; }
.logo-text .t2 { font-size:10px;color:rgba(212,168,67,0.65); }

h1 { font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:#fff;margin-bottom:6px;text-align:center; }
.subtitle { font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:26px;text-align:center;line-height:1.6; }

.f-group { margin-bottom:14px; }
.f-label { display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,0.4);margin-bottom:7px; }
.f-input { width:100%;padding:12px 15px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border .2s; }
.f-input::placeholder { color:rgba(255,255,255,0.25); }
.f-input:focus { border-color:rgba(27,174,204,0.5); }

.strength-bar { height:4px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:8px;overflow:hidden; }
.strength-fill { height:100%;border-radius:2px;transition:all .3s;width:0%; }
.strength-text { font-size:11px;color:rgba(255,255,255,0.3);margin-top:4px; }

.status-msg { font-size:13px;padding:11px 15px;border-radius:10px;margin-bottom:14px;display:none;line-height:1.5;text-align:center; }
.status-msg.error   { display:block;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#fca5a5; }
.status-msg.success { display:block;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#86efac; }

.btn-submit { width:100%;padding:13px;border-radius:11px;background:linear-gradient(135deg,var(--cyan),var(--teal));border:none;color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:6px; }
.btn-submit:hover:not(:disabled) { transform:translateY(-1px);box-shadow:0 8px 24px rgba(27,174,204,0.28); }
.btn-submit:disabled { opacity:.6;cursor:not-allowed;transform:none; }

#loadingState { text-align:center;padding:20px 0;color:rgba(255,255,255,0.5);font-size:14px;line-height:1.8; }
#resetForm { display:none; }
#successState { display:none;text-align:center;padding:20px 0; }
.success-icon { font-size:52px;margin-bottom:14px; }
.success-title { font-family:'Playfair Display',serif;font-size:22px;color:#fff;margin-bottom:10px; }
.success-sub { font-size:13px;color:rgba(255,255,255,0.45);margin-bottom:20px;line-height:1.7; }
.go-link { display:inline-block;padding:12px 24px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-weight:700;font-size:14px;text-decoration:none; }

.back-link { display:block;text-align:center;margin-top:20px;font-size:12px;color:rgba(255,255,255,0.28);text-decoration:none; }
.back-link:hover { color:var(--gold); }

@media(max-width:480px) { .card { padding:32px 22px; } }

<body>
<div class="bg-grid"></div>
<div class="bg-orb"></div>

<div class="card">
  <a href="https://kulaninstitute.org" class="logo">
    <div class="logo-icon">KI</div>
    <div class="logo-text"><div class="t1">Kulan Institute of Technology and Science</div><div class="t2">Learn. Grow. Lead.</div></div>
  </a>

  <div id="loadingState">
    <div style="font-size:36px;margin-bottom:14px;">&#128274;</div>
    Verifying your reset link...
  </div>

  <div id="resetForm">
    <h1>Set New Password</h1>
    <p class="subtitle">Choose a strong password for your account.</p>
    <div id="statusMsg" class="status-msg"></div>
    <div class="f-group">
      <label class="f-label">New Password</label>
      <input type="password" class="f-input" id="passInput" placeholder="Create a strong password" oninput="checkStrength(this.value)">
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-text" id="strengthText"></div>
    </div>
    <div class="f-group">
      <label class="f-label">Confirm Password</label>
      <input type="password" class="f-input" id="confirmInput" placeholder="Confirm new password">
    </div>
    <button class="btn-submit" id="submitBtn" onclick="doReset()">&#128274; Update Password</button>
    <a href="/login.html" class="back-link">&larr; Back to login</a>
  </div>

  <div id="successState">
    <div class="success-icon">&#10003;</div>
    <div class="success-title">Password Updated!</div>
    <p class="success-sub">Your password has been changed. Sign in with your new password.</p>
    <a href="/login.html" class="go-link">Sign In &rarr;</a>
  </div>
</div>

<script>
function showStatus(msg, type) {
  var el = document.getElementById('statusMsg');
  el.textContent = msg; el.className = 'status-msg ' + type;
}

function checkStrength(pass) {
  var fill = document.getElementById('strengthFill');
  var text = document.getElementById('strengthText');
  if (!pass) { fill.style.width='0%'; text.textContent=''; return; }
  var score = 0;
  if (pass.length >= 8)  score++;
  if (pass.length >= 12) score++;
  if (/[A-Z]/.test(pass)) score++;
  if (/[0-9]/.test(pass)) score++;
  if (/[^A-Za-z0-9]/.test(pass)) score++;
  var levels = [
    { w:'20%', c:'#DC2626', t:'Very weak' },
    { w:'40%', c:'#f97316', t:'Weak' },
    { w:'60%', c:'#eab308', t:'Fair' },
    { w:'80%', c:'#16A34A', t:'Strong' },
    { w:'100%',c:'#16A34A', t:'Very strong' }
  ];
  var lvl = levels[Math.min(score, 4)];
  fill.style.width = lvl.w; fill.style.background = lvl.c; text.textContent = lvl.t;
}

function doReset() {
  var pass    = document.getElementById('passInput').value;
  var confirm = document.getElementById('confirmInput').value;
  if (!pass || pass.length < 8) { showStatus('Password must be at least 8 characters.','error'); return; }
  if (pass !== confirm) { showStatus('Passwords do not match.','error'); return; }
  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Updating...';
  _sb.auth.updateUser({ password: pass }).then(function(result) {
    if (result.error) {
      showStatus(result.error.message || 'Could not update password. Try requesting a new reset link.','error');
      btn.disabled = false; btn.textContent = '🔓 Update Password';
    } else {
      document.getElementById('resetForm').style.display    = 'none';
      document.getElementById('successState').style.display = 'block';
      setTimeout(function() { _sb.auth.signOut(); }, 500);
    }
  });
}

_sb.auth.onAuthStateChange(function(event, session) {
  if (event === 'PASSWORD_RECOVERY') {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('resetForm').style.display = 'block';
  }
});

_sb.auth.getSession().then(function(result) {
  if (result.data.session) {
    var hash = window.location.hash;
    if (hash.indexOf('type=recovery') > -1 || hash.indexOf('access_token') > -1) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('resetForm').style.display = 'block';
    } else {
      window.location.href = '/dashboard.html';
    }
  } else {
    setTimeout(function() {
      var loading = document.getElementById('loadingState');
      var form    = document.getElementById('resetForm');
      if (loading.style.display !== 'none' && form.style.display === 'none') {
        loading.innerHTML = '<div style="font-size:36px;margin-bottom:14px;">&#128683;</div><p style="color:#fca5a5;margin-bottom:16px;">This reset link has expired or is invalid.</p><a href="/login.html" style="color:var(--cyan);font-size:14px;">Request a new one &rarr;</a>';
      }
    }, 4000);
  }
});
</script>
</body>

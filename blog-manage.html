var ADMIN_EMAIL = 'mohamedmohammud@gmail.com';

<style>
:root {
  --navy:#0B1F3A; --blue:#1A3C6E; --cyan:#1BAECC;
  --gold:#D4A843; --gold2:#e8c060; --teal:#0E7C7B;
  --bg:#F4F7FB; --text:#1a2840; --text-mid:#4a6080; --text-light:#8a9bb0;
}
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

#loadingScreen { position:fixed;inset:0;background:linear-gradient(160deg,#0B1F3A,#1A3C6E);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9999; }
.ld-logo { width:48px;height:48px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;font-size:22px;color:var(--navy); }
.ld-spin { width:26px;height:26px;border:2.5px solid rgba(255,255,255,0.1);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg);} }
.ld-text { font-size:14px;color:rgba(255,255,255,0.5); }
#page { display:none; }

/* TOPBAR */
.topbar { background:var(--navy);padding:0 32px;height:62px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(212,168,67,0.2);position:sticky;top:0;z-index:10; }
.tb-left { display:flex;align-items:center;gap:16px; }
.tb-back { display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,0.4);text-decoration:none;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);transition:all .2s; }
.tb-back:hover { color:var(--gold);border-color:rgba(212,168,67,0.3); }
.tb-title { font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:#fff; }
.tb-right { display:flex;align-items:center;gap:12px; }
.tb-user { font-size:13px;color:rgba(255,255,255,0.45); }
.tb-logout { background:none;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:7px 14px;font-size:12px;color:rgba(255,255,255,0.5);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s; }
.tb-logout:hover { color:#fff;border-color:rgba(255,255,255,0.35); }

/* MAIN */
.main { max-width:1100px;margin:0 auto;padding:36px 24px 80px; }

/* STATS */
.stats-row { display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px; }
.stat-card { background:#fff;border-radius:14px;padding:20px 22px;border:1px solid rgba(11,31,58,0.07); }
.stat-label { font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-light);margin-bottom:6px; }
.stat-num { font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--navy); }

/* TOOLBAR */
.toolbar { background:#fff;border-radius:14px;padding:16px 20px;border:1px solid rgba(11,31,58,0.07);margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap; }
.search-input { flex:1;min-width:200px;padding:10px 14px;border:1.5px solid rgba(11,31,58,0.12);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border .2s; }
.search-input:focus { border-color:var(--cyan); }
.filter-select { padding:10px 14px;border:1.5px solid rgba(11,31,58,0.12);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;background:#fff;cursor:pointer; }
.btn-new { padding:10px 20px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap; }
.btn-new:hover { transform:translateY(-1px);box-shadow:0 6px 18px rgba(11,31,58,0.2); }

/* POSTS LIST */
.posts-list { display:flex;flex-direction:column;gap:12px; }
.post-card { background:#fff;border-radius:14px;padding:20px 24px;border:1px solid rgba(11,31,58,0.07);display:flex;align-items:center;gap:16px;transition:box-shadow .2s; }
.post-card:hover { box-shadow:0 6px 20px rgba(11,31,58,0.08); }
.post-cat-icon { width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0; }
.post-info { flex:1;min-width:0; }
.post-title-text { font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px; }
.post-meta-row { display:flex;align-items:center;gap:10px;flex-wrap:wrap; }
.badge { display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600; }
.badge-published { background:rgba(34,197,94,0.1);color:#16a34a; }
.badge-draft     { background:rgba(11,31,58,0.07);color:var(--text-light); }
.post-date { font-size:12px;color:var(--text-light); }
.post-read-time { font-size:12px;color:var(--text-light); }
.post-actions { display:flex;gap:8px;flex-shrink:0; }
.btn-edit   { padding:8px 14px;border-radius:8px;border:1.5px solid rgba(11,31,58,0.12);background:transparent;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-mid);transition:all .2s; }
.btn-edit:hover { border-color:var(--navy);color:var(--navy); }
.btn-delete { padding:8px 14px;border-radius:8px;border:none;background:rgba(239,68,68,0.08);font-size:12px;font-weight:600;cursor:pointer;color:#dc2626;transition:all .2s; }
.btn-delete:hover { background:rgba(239,68,68,0.15); }

/* EDITOR */
.editor-wrap { background:#fff;border-radius:16px;padding:32px;border:1px solid rgba(11,31,58,0.07);margin-bottom:24px;display:none; }
.editor-wrap.open { display:block; }
.editor-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:24px; }
.editor-title-text { font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--navy); }
.editor-close { background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);transition:color .2s; }
.editor-close:hover { color:var(--navy); }
.editor-grid { display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px; }
.f-group { margin-bottom:0; }
.f-group.span2 { grid-column:1/-1; }
.f-label { display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text-mid);margin-bottom:7px; }
.f-input,.f-select,.f-textarea { width:100%;padding:11px 14px;border:1.5px solid rgba(11,31,58,0.12);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border .2s;background:#fff; }
.f-input:focus,.f-select:focus,.f-textarea:focus { border-color:var(--cyan); }
.f-textarea { resize:vertical;min-height:100px; }
.f-textarea.content { min-height:320px;font-family:monospace;font-size:13px;line-height:1.7; }
.f-hint { font-size:11px;color:var(--text-light);margin-top:5px;line-height:1.5; }
.editor-actions { display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:20px;border-top:1px solid rgba(11,31,58,0.07); }
.btn-cancel { padding:11px 22px;border-radius:10px;border:1.5px solid rgba(11,31,58,0.12);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-mid); }
.btn-save-draft { padding:11px 22px;border-radius:10px;border:1.5px solid rgba(11,31,58,0.2);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--navy); }
.btn-publish { padding:11px 28px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s; }
.btn-publish:hover { transform:translateY(-1px);box-shadow:0 6px 18px rgba(212,168,67,0.3); }

/* EMPTY STATE */
.empty-state { text-align:center;padding:72px 24px;color:var(--text-light); }
.empty-state .e-icon { font-size:52px;margin-bottom:16px; }
.empty-state h3 { font-size:18px;font-weight:600;color:var(--text-mid);margin-bottom:8px; }
.empty-state p { font-size:14px;line-height:1.7; }

/* NOTIF */
.notif { position:fixed;bottom:24px;right:24px;padding:13px 20px;border-radius:12px;background:var(--navy);color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 28px rgba(11,31,58,0.3);transform:translateY(80px);opacity:0;transition:all .3s;z-index:999; }
.notif.show { transform:translateY(0);opacity:1; }
.notif.success { background:#16a34a; }
.notif.error { background:#dc2626; }

/* CAT COLORS */
.cat-ai        { background:rgba(27,174,204,0.1); }
.cat-cyber     { background:rgba(212,168,67,0.1); }
.cat-community { background:rgba(14,124,123,0.1); }
.cat-trends    { background:rgba(26,60,110,0.1); }
.cat-career    { background:rgba(139,92,246,0.1); }
.cat-updates   { background:rgba(11,31,58,0.07); }

@media(max-width:768px) {
  .topbar { padding:0 16px; }
  .main { padding:24px 16px 60px; }
  .stats-row { grid-template-columns:repeat(2,1fr); }
  .editor-grid { grid-template-columns:1fr; }
  .f-group.span2 { grid-column:1; }
  .post-card { flex-wrap:wrap; }
}
@media(max-width:480px) {
  .topbar,.main { padding-left:14px !important; padding-right:14px !important; }
  .stats-row { grid-template-columns:1fr 1fr !important; }
  .toolbar { flex-direction:column; align-items:stretch; }
  .search-input { min-width:unset; width:100%; }
  .tb-user { display:none; }
}
</style>

<body>

<div id="loadingScreen">
  <div class="ld-logo">KI</div>
  <div class="ld-spin"></div>
  <div class="ld-text">Loading blog management...</div>
</div>

<div id="page">
  <div class="topbar">
    <div class="tb-left">
      <a href="/admin.html" class="tb-back">&larr; Admin Panel</a>
      <div class="tb-title">Blog Management</div>
    </div>
    <div class="tb-right">
      <span class="tb-user" id="adminEmail"></span>
      <button class="tb-logout" id="logoutBtn">Sign Out</button>
    </div>
  </div>

  <div class="main">

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Posts</div>
        <div class="stat-num" id="statTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Published</div>
        <div class="stat-num" id="statPublished">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Drafts</div>
        <div class="stat-num" id="statDrafts">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Categories</div>
        <div class="stat-num" id="statCats">—</div>
      </div>
    </div>

    <!-- Editor -->
    <div class="editor-wrap" id="editorWrap">
      <div class="editor-header">
        <div class="editor-title-text" id="editorHeading">New Post</div>
        <button class="editor-close" onclick="closeEditor()">&#215;</button>
      </div>
      <input type="hidden" id="editingPostId">
      <div class="editor-grid">
        <div class="f-group span2">
          <label class="f-label">Title <span style="color:var(--gold)">*</span></label>
          <input type="text" class="f-input" id="postTitle" placeholder="Article title...">
        </div>
        <div class="f-group">
          <label class="f-label">Category <span style="color:var(--gold)">*</span></label>
          <select class="f-select" id="postCategory">
            <option value="">Select category...</option>
            <option>AI &amp; Technology</option>
            <option>Cybersecurity</option>
            <option>Community</option>
            <option>Tech Trends</option>
            <option>Career</option>
            <option>Updates</option>
          </select>
        </div>
        <div class="f-group">
          <label class="f-label">Read Time (minutes)</label>
          <input type="number" class="f-input" id="postReadTime" value="5" min="1" max="60">
        </div>
        <div class="f-group span2">
          <label class="f-label">Excerpt <span style="color:var(--gold)">*</span></label>
          <textarea class="f-textarea" id="postExcerpt" placeholder="Short description shown on the blog homepage (1-2 sentences)..."></textarea>
        </div>
        <div class="f-group span2">
          <label class="f-label">Content (HTML) <span style="color:var(--gold)">*</span></label>
          <textarea class="f-textarea content" id="postContent" placeholder="Write your article in HTML...&#10;&#10;Examples:&#10;&lt;h2&gt;Section Title&lt;/h2&gt;&#10;&lt;p&gt;Paragraph text.&lt;/p&gt;&#10;&lt;ul&gt;&lt;li&gt;List item&lt;/li&gt;&lt;/ul&gt;&#10;&lt;strong&gt;Bold text&lt;/strong&gt;&#10;&lt;blockquote&gt;&lt;p&gt;Quote text&lt;/p&gt;&lt;/blockquote&gt;&#10;&lt;div class=&quot;callout&quot;&gt;&lt;p&gt;Callout box&lt;/p&gt;&lt;/div&gt;"></textarea>
          <div class="f-hint">Use HTML tags. For callout boxes: &lt;div class="callout"&gt;&lt;p&gt;...&lt;/p&gt;&lt;/div&gt;</div>
        </div>
      </div>
      <div class="editor-actions">
        <button class="btn-cancel" onclick="closeEditor()">Cancel</button>
        <button class="btn-save-draft" onclick="savePost('draft')">Save as Draft</button>
        <button class="btn-publish" onclick="savePost('published')">&#10003; Publish</button>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input type="text" class="search-input" id="searchInput" placeholder="&#128269; Search posts..." oninput="filterPosts()">
      <select class="filter-select" id="statusFilter" onchange="filterPosts()">
        <option value="">All Status</option>
        <option value="published">Published</option>
        <option value="draft">Draft</option>
      </select>
      <select class="filter-select" id="catFilter" onchange="filterPosts()">
        <option value="">All Categories</option>
        <option>AI &amp; Technology</option>
        <option>Cybersecurity</option>
        <option>Community</option>
        <option>Tech Trends</option>
        <option>Career</option>
        <option>Updates</option>
      </select>
      <button class="btn-new" onclick="openNewPost()">&#43; New Post</button>
    </div>

    <div class="posts-list" id="postsList"></div>

  </div>
</div>

<div class="notif" id="notif"></div>

<script>
var _allPosts = [];
var _notifTimer;

var catIcons = {
  'AI & Technology': '&#129302;',
  'Cybersecurity':   '&#128737;',
  'Community':       '&#127758;',
  'Tech Trends':     '&#128200;',
  'Career':          '&#128188;',
  'Updates':         '&#128226;'
};
var catBg = {
  'AI & Technology': 'cat-ai',
  'Cybersecurity':   'cat-cyber',
  'Community':       'cat-community',
  'Tech Trends':     'cat-trends',
  'Career':          'cat-career',
  'Updates':         'cat-updates'
};

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showNotif(msg, type) {
  var el = document.getElementById('notif');
  el.textContent = msg; el.className = 'notif show' + (type ? ' '+type : '');
  clearTimeout(_notifTimer); _notifTimer = setTimeout(function(){ el.classList.remove('show'); }, 3000);
}
function formatDate(d) { return d ? new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '—'; }

// ── AUTH ─────────────────────────────────────────────────────
var _started = false;
function tryStart(user) { if(_started||!user) return; _started=true; checkAccess(user); }
_sb.auth.getSession().then(function(r) {
  tryStart(r.data.session ? r.data.session.user : null);
  if (!r.data.session) {
    setTimeout(function(){ _sb.auth.getSession().then(function(r2){ tryStart(r2.data.session?r2.data.session.user:null); }); }, 1500);
    setTimeout(function(){ if(!_started) window.location.href='/login.html'; }, 9000);
  }
});
_sb.auth.onAuthStateChange(function(e,s){ if(e==='SIGNED_IN') tryStart(s?s.user:null); if(e==='SIGNED_OUT') window.location.href='/login.html'; });

function checkAccess(user) {
  var email = (user.email||'').toLowerCase();
  if (email === ADMIN_EMAIL.toLowerCase() || user.id === ADMIN_UID) { startPage(user); return; }
  _sb.from('users').select('role').eq('id',user.id).single()
    .then(function(r){ (r.data&&r.data.role==='admin') ? startPage(user) : window.location.href='/login.html'; })
    .catch(function(){ email===ADMIN_EMAIL.toLowerCase() ? startPage(user) : window.location.href='/login.html'; });
}

function startPage(user) {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('page').style.display = 'block';
  document.getElementById('adminEmail').textContent = user.email;
  document.getElementById('logoutBtn').addEventListener('click', function(){ _sb.auth.signOut().then(function(){ window.location.href='/login.html'; }); });
  loadPosts();
}

// ── LOAD ─────────────────────────────────────────────────────
function loadPosts() {
  document.getElementById('postsList').innerHTML = '<div class="empty-state"><div class="e-icon">&#9203;</div><h3>Loading posts...</h3></div>';
  _sb.from('posts').select('*').order('published_at', { ascending: false })
    .then(function(r) {
      if (r.error) {
        document.getElementById('postsList').innerHTML = '<div class="empty-state"><div class="e-icon">&#9888;</div><h3>Error loading posts</h3><p>' + esc(r.error.message) + '<br>Make sure users_setup_v2.sql has been run.</p></div>';
        return;
      }
      _allPosts = r.data || [];
      updateStats(_allPosts);
      renderPosts(_allPosts);
    });
}

function updateStats(posts) {
  document.getElementById('statTotal').textContent     = posts.length;
  document.getElementById('statPublished').textContent = posts.filter(function(p){ return p.status==='published'; }).length;
  document.getElementById('statDrafts').textContent    = posts.filter(function(p){ return p.status==='draft'; }).length;
  var cats = new Set(posts.map(function(p){ return p.category; }).filter(Boolean));
  document.getElementById('statCats').textContent      = cats.size;
}

// ── FILTER ───────────────────────────────────────────────────
function filterPosts() {
  var search = document.getElementById('searchInput').value.toLowerCase();
  var status = document.getElementById('statusFilter').value;
  var cat    = document.getElementById('catFilter').value;
  var filtered = _allPosts.filter(function(p) {
    var ms = !search || (p.title||'').toLowerCase().includes(search) || (p.excerpt||'').toLowerCase().includes(search);
    var mv = !status || p.status === status;
    var mc = !cat    || p.category === cat;
    return ms && mv && mc;
  });
  renderPosts(filtered);
}

// ── RENDER ────────────────────────────────────────────────────
function renderPosts(posts) {
  var list = document.getElementById('postsList');
  if (!posts.length) {
    list.innerHTML = '<div class="empty-state"><div class="e-icon">&#128221;</div><h3>No posts yet</h3><p>Click New Post to write your first article.</p></div>';
    return;
  }
  list.innerHTML = posts.map(function(p) {
    var icon   = catIcons[p.category] || '&#128221;';
    var bg     = catBg[p.category]   || 'cat-updates';
    var isPub  = p.status === 'published';
    return '<div class="post-card">'
      + '<div class="post-cat-icon ' + bg + '">' + icon + '</div>'
      + '<div class="post-info">'
      + '<div class="post-title-text">' + esc(p.title) + '</div>'
      + '<div class="post-meta-row">'
      + '<span class="badge ' + (isPub ? 'badge-published' : 'badge-draft') + '">' + (isPub ? 'Published' : 'Draft') + '</span>'
      + '<span class="post-date">' + formatDate(p.published_at) + '</span>'
      + '<span class="post-read-time">' + (p.read_time||5) + ' min read</span>'
      + (p.category ? '<span class="post-date">' + esc(p.category) + '</span>' : '')
      + '</div>'
      + '</div>'
      + '<div class="post-actions">'
      + '<button class="btn-edit" onclick="editPost(' + "'" + p.id + "'" + ')">Edit</button>'
      + '<button class="btn-delete" onclick="deletePost(' + "'" + p.id + "'" + ')">Delete</button>'
      + '</div>'
      + '</div>';
  }).join('');
}

// ── EDITOR ────────────────────────────────────────────────────
function openNewPost() {
  document.getElementById('editingPostId').value = '';
  document.getElementById('editorHeading').textContent = 'New Post';
  document.getElementById('postTitle').value    = '';
  document.getElementById('postCategory').value = '';
  document.getElementById('postExcerpt').value  = '';
  document.getElementById('postContent').value  = '';
  document.getElementById('postReadTime').value = '5';
  var wrap = document.getElementById('editorWrap');
  wrap.classList.add('open');
  wrap.scrollIntoView({ behavior:'smooth' });
}

function editPost(id) {
  var p = _allPosts.find(function(x){ return x.id===id; });
  if (!p) return;
  document.getElementById('editingPostId').value = p.id;
  document.getElementById('editorHeading').textContent = 'Edit Post';
  document.getElementById('postTitle').value    = p.title || '';
  document.getElementById('postCategory').value = p.category || '';
  document.getElementById('postExcerpt').value  = p.excerpt || '';
  document.getElementById('postContent').value  = p.content || '';
  document.getElementById('postReadTime').value = p.read_time || 5;
  var wrap = document.getElementById('editorWrap');
  wrap.classList.add('open');
  wrap.scrollIntoView({ behavior:'smooth' });
}

function closeEditor() {
  document.getElementById('editorWrap').classList.remove('open');
  document.getElementById('editingPostId').value = '';
}

function savePost(status) {
  var id      = document.getElementById('editingPostId').value;
  var title   = document.getElementById('postTitle').value.trim();
  var cat     = document.getElementById('postCategory').value;
  var excerpt = document.getElementById('postExcerpt').value.trim();
  var content = document.getElementById('postContent').value.trim();
  var rt      = parseInt(document.getElementById('postReadTime').value) || 5;

  if (!title)   { showNotif('Title is required.','error'); return; }
  if (!cat)     { showNotif('Please select a category.','error'); return; }
  if (!excerpt) { showNotif('Excerpt is required.','error'); return; }
  if (!content) { showNotif('Content is required.','error'); return; }

  var payload = {
    title: title, category: cat, excerpt: excerpt, content: content,
    read_time: rt, status: status, author: 'Mohamud Mohamed',
    updated_at: new Date().toISOString()
  };
  if (status === 'published' && !id) payload.published_at = new Date().toISOString();

  var op = id
    ? _sb.from('posts').update(payload).eq('id', id)
    : _sb.from('posts').insert([payload]);

  op.then(function(r) {
    if (r.error) { showNotif('Error: ' + r.error.message, 'error'); return; }
    showNotif(id ? 'Post updated!' : (status==='published' ? 'Post published!' : 'Draft saved!'), 'success');
    closeEditor();
    loadPosts();
  });
}

function deletePost(id) {
  var p = _allPosts.find(function(x){ return x.id===id; });
  if (!confirm('Delete "' + (p?p.title:'this post') + '"? This cannot be undone.')) return;
  _sb.from('posts').delete().eq('id', id).then(function(r) {
    if (r.error) { showNotif('Error: ' + r.error.message,'error'); return; }
    showNotif('Post deleted.','success');
    loadPosts();
  });
}
</script>
</body>
</html>

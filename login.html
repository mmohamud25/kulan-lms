<style>
:root {
  --navy:#0B1F3A; --blue:#1A3C6E; --cyan:#1BAECC;
  --gold:#D4A843; --gold2:#e8c060; --teal:#0E7C7B;
}
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'DM Sans',sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#060f1e 0%,var(--navy) 55%,#0d2a50 100%);
  position:relative; overflow:hidden; padding:20px;
}
.bg-grid {
  position:absolute; inset:0;
  background-image:linear-gradient(rgba(27,174,204,0.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(27,174,204,0.05) 1px,transparent 1px);
  background-size:56px 56px; pointer-events:none;
}
.bg-orb1 { position:absolute;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(27,174,204,0.1),transparent 70%);left:-160px;bottom:-160px;pointer-events:none; }
.bg-orb2 { position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(212,168,67,0.06),transparent 70%);right:-80px;top:-80px;pointer-events:none; }

.card {
  position:relative; z-index:1;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:22px; padding:44px 40px;
  width:100%; max-width:420px;
  backdrop-filter:blur(14px);
  box-shadow:0 24px 64px rgba(0,0,0,0.3);
}

/* Logo */
.logo { display:flex;align-items:center;gap:12px;text-decoration:none;margin-bottom:30px;justify-content:center; }
.logo-icon { width:46px;height:46px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;font-size:21px;color:var(--navy);flex-shrink:0; }
.logo-text .t1 { font-size:14px;font-weight:700;color:#fff; }
.logo-text .t2 { font-size:10px;color:rgba(212,168,67,0.65); }

h1 { font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#fff;margin-bottom:6px;text-align:center; }
.subtitle { font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:28px;text-align:center;line-height:1.6; }

/* Form fields */
.f-group { margin-bottom:14px; }
.f-label { display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,0.4);margin-bottom:7px; }
.f-input {
  width:100%; padding:12px 15px; border-radius:10px;
  border:1.5px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.06); color:#fff;
  font-family:'DM Sans',sans-serif; font-size:14px;
  outline:none; transition:border .2s, box-shadow .2s;
}
.f-input::placeholder { color:rgba(255,255,255,0.25); }
.f-input:focus { border-color:rgba(27,174,204,0.5);box-shadow:0 0 0 3px rgba(27,174,204,0.08); }

.pw-wrap { position:relative; }
.pw-eye { position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.3);font-size:16px;padding:4px;transition:color .2s;line-height:1; }
.pw-eye:hover { color:rgba(255,255,255,0.6); }

.forgot { display:block;text-align:right;font-size:12px;color:rgba(255,255,255,0.3);text-decoration:none;margin-top:6px;margin-bottom:18px;transition:color .2s; }
.forgot:hover { color:var(--gold); }

/* Status */
.status-msg { font-size:13px;padding:11px 15px;border-radius:10px;margin-bottom:14px;display:none;line-height:1.5;text-align:center; }
.status-msg.error   { display:block;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#fca5a5; }
.status-msg.success { display:block;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#86efac; }
.status-msg.info    { display:block;background:rgba(27,174,204,0.08);border:1px solid rgba(27,174,204,0.2);color:#67e8f9; }

/* Sign in button */
.btn-signin {
  width:100%; padding:13px; border-radius:11px;
  background:linear-gradient(135deg,var(--cyan),var(--teal));
  border:none; color:#fff; font-family:'DM Sans',sans-serif;
  font-size:15px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:all .2s;
}
.btn-signin:hover:not(:disabled) { transform:translateY(-1px);box-shadow:0 8px 24px rgba(27,174,204,0.28); }
.btn-signin:disabled { opacity:.6;cursor:not-allowed;transform:none; }
.btn-spin { width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none; }
@keyframes spin { to{transform:rotate(360deg);} }

/* Redirect bar */
.redirect-bar { display:none;margin-top:18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:11px;padding:14px 16px; }
.redirect-bar.show { display:block; }
.redirect-role { font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:8px; }
.redirect-role strong { color:#fff; }
.redirect-track { height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden; }
.redirect-fill { height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:2px;width:0%;transition:width .7s ease; }

/* Links row */
.links-row { margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.07);display:flex;justify-content:center;gap:18px;flex-wrap:wrap; }
.links-row a { font-size:12px;color:rgba(255,255,255,0.28);text-decoration:none;transition:color .2s; }
.links-row a:hover { color:var(--gold); }

@media(max-width:480px) {
  .card { padding:32px 22px; }
  h1 { font-size:22px; }
}
</style>

<body>
<div class="bg-grid"></div>
<div class="bg-orb1"></div>
<div class="bg-orb2"></div>

<div class="card">
  <a href="https://kulaninstitute.org" class="logo">
    <div class="logo-icon">KI</div>
    <div class="logo-text">
      <div class="t1">Kulan Institute</div>
      <div class="t2">of Learning</div>
    </div>
  </a>

  <h1>Welcome Back</h1>
  <p class="subtitle">Sign in — you will be taken to the right place automatically.</p>

  <div id="statusMsg" class="status-msg"></div>

  <div class="f-group">
    <label class="f-label">Email Address</label>
    <input type="email" class="f-input" id="emailInput" placeholder="you@example.com" autocomplete="email">
  </div>

  <div class="f-group">
    <label class="f-label">Password</label>
    <div class="pw-wrap">
      <input type="password" class="f-input" id="passInput" placeholder="Your password" autocomplete="current-password">
      <button type="button" class="pw-eye" id="pwEye" onclick="togglePw()">&#128065;</button>
    </div>
  </div>

  <a href="/reset-password.html" class="forgot">Forgot password?</a>

  <button class="btn-signin" id="loginBtn">
    <div class="btn-spin" id="btnSpinner"></div>
    <span id="btnText">Sign In</span>
  </button>

  <div class="redirect-bar" id="redirectBar">
    <div class="redirect-role" id="redirectRole">Signing you in...</div>
    <div class="redirect-track"><div class="redirect-fill" id="redirectFill"></div></div>
  </div>

  <div class="links-row">
    <a href="https://kulaninstitute.org">&#127758; Homepage</a>
    <a href="https://apply.kulaninstitute.org">&#128221; Apply</a>
    <a href="https://community.kulaninstitute.org">&#128101; Community</a>
  </div>
</div>

<script>
function showStatus(msg, type) {
  var el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
}

function setLoading(loading) {
  var btn = document.getElementById('loginBtn');
  var spinner = document.getElementById('btnSpinner');
  var text = document.getElementById('btnText');
  btn.disabled = loading;
  spinner.style.display = loading ? 'block' : 'none';
  text.textContent = loading ? 'Signing in...' : 'Sign In';
}

function togglePw() {
  var inp = document.getElementById('passInput');
  var eye = document.getElementById('pwEye');
  if (inp.type === 'password') { inp.type = 'text'; eye.innerHTML = '&#128683;'; }
  else { inp.type = 'password'; eye.innerHTML = '&#128065;'; }
}

function showRedirect(roleLabel, destination) {
  var bar  = document.getElementById('redirectBar');
  var role = document.getElementById('redirectRole');
  var fill = document.getElementById('redirectFill');
  role.innerHTML = 'Signed in as <strong>' + roleLabel + '</strong> — redirecting...';
  bar.classList.add('show');
  setTimeout(function() { fill.style.width = '100%'; }, 50);
  setTimeout(function() { window.location.href = destination; }, 800);
}

function redirectByRole(user) {
  var email = (user.email || '').toLowerCase();

  // Admin shortcut — no table query needed
  if (email === ADMIN_EMAIL.toLowerCase()) {
    showRedirect('Admin', '/admin.html'); return;
  }

  // Also check user_metadata role as quick fallback
  var metaRole = user.user_metadata && user.user_metadata.role;
  if (metaRole === 'admin')   { showRedirect('Admin',   '/admin.html');   return; }
  if (metaRole === 'teacher') { showRedirect('Teacher', '/teacher.html'); return; }

  // Query users table with a timeout fallback
  var redirected = false;
  var fallbackTimer = setTimeout(function() {
    if (!redirected) {
      redirected = true;
      // Use metadata role if available, otherwise default to student
      if (metaRole === 'teacher') showRedirect('Teacher', '/teacher.html');
      else if (metaRole === 'admin') showRedirect('Admin', '/admin.html');
      else showRedirect('Student', '/dashboard.html');
    }
  }, 4000);

  _sb.from('users').select('role').eq('id', user.id).single()
    .then(function(r) {
      if (redirected) return;
      clearTimeout(fallbackTimer);
      redirected = true;
      var role = (r.data && r.data.role) ? r.data.role : 'student';
      if (role === 'admin')        showRedirect('Admin',   '/admin.html');
      else if (role === 'teacher') showRedirect('Teacher', '/teacher.html');
      else                         showRedirect('Student', '/dashboard.html');
    })
    .catch(function() {
      if (redirected) return;
      clearTimeout(fallbackTimer);
      redirected = true;
      // Fall back to metadata role or student
      if (metaRole === 'teacher') showRedirect('Teacher', '/teacher.html');
      else showRedirect('Student', '/dashboard.html');
    });
}

_sb.auth.getSession().then(function(r) {
  if (r.data.session && r.data.session.user) redirectByRole(r.data.session.user);
});
_sb.auth.onAuthStateChange(function(event, session) {
  if (event === 'SIGNED_IN' && session && session.user) redirectByRole(session.user);
});

function doLogin() {
  var email = document.getElementById('emailInput').value.trim();
  var pass  = document.getElementById('passInput').value;
  document.getElementById('emailInput').style.borderColor = '';
  document.getElementById('passInput').style.borderColor  = '';
  if (!email) { document.getElementById('emailInput').style.borderColor='rgba(239,68,68,0.5)'; showStatus('Please enter your email address.','error'); return; }
  if (!pass)  { document.getElementById('passInput').style.borderColor='rgba(239,68,68,0.5)';  showStatus('Please enter your password.','error'); return; }
  setLoading(true);
  _sb.auth.signInWithPassword({ email:email, password:pass })
    .then(function(result) {
      if (result.error) {
        setLoading(false);
        var msg = result.error.message || 'Sign in failed.';
        if (msg.toLowerCase().includes('invalid')) msg = 'Incorrect email or password.';
        else if (msg.toLowerCase().includes('confirm')) msg = 'Please confirm your email before signing in.';
        showStatus(msg, 'error');
      } else {
        showStatus('', '');
        redirectByRole(result.data.user);
      }
    })
    .catch(function() { setLoading(false); showStatus('Connection error. Please try again.', 'error'); });
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
</script>
</body>
